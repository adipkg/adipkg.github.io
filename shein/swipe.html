<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1ee">
<link rel="preload" as="image" href="assets/fabric.jpg">
<title>Swipe · SHEIN co·create</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }</script>
</head>
<body>
<main class="app">
  <header class="topbar"></header>
  <div class="phase-row"><span id="phase-label" class="eyebrow" style="margin:0"></span><span id="phase-meta" class="small muted"></span></div>
  <div class="progress" role="progressbar" aria-label="Progress"><i id="progress"></i></div>
  <section id="deck"></section>
  <div class="controls">
    <button class="round nope" data-dir="left" aria-label="Not for me" title="Not for me (←)"></button>
    <button class="round super" data-dir="up" aria-label="Order" title="Order a one-off (↑)"></button>
    <button class="round like" data-dir="right" aria-label="Like" title="Like (→)"></button>
  </div>
  <p class="hint" id="hint"></p>
  <footer class="footer"></footer>
</main>
<script type="module">
import { chrome, garmentCard, toast, icon } from './js/ui.js';
import { Deck } from './js/swipe.js';
import { loadCatalog, loadCards, allowedBlocks } from './js/taste.js';
import { requireUser, getUser, getProfile, updateUser, recordSignal, touchPresence } from './js/store.js';
import { assignCohort } from './js/cohorts.js';
import { ONBOARDING_CARDS } from './js/config.js';

chrome('swipe.html');
const u = requireUser();
const [catalog, cards, user] = await Promise.all([loadCatalog(), loadCards(), getUser(u)]);
if (!user) { location.replace('index.html'); }
let profile = await getProfile(u);
touchPresence(u);

const $ = (s) => document.querySelector(s);
$('.round.nope').innerHTML = icon('x', { size: 26 });
$('.round.super').innerHTML = icon('bag', { size: 22 });
$('.round.like').innerHTML = icon('heart', { fill: true, size: 26 });
const deckEl = $('#deck');
let deck;

function setPhase(label, pct, meta = '') {
  const [a, b] = label.split(' · ');
  $('#phase-label').textContent = a; $('#phase-meta').textContent = b || meta;
  $('#progress').style.width = `${pct}%`;
}

// The onboarding deck: cards that fit the shopper's gender and occasions, one per garment type first,
// in a stable per-user order so a reload resumes where they left off.
function onboardingDeck() {
  const ok = new Set(allowedBlocks(catalog, user));
  let h = [...u].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => ((h = (h * 1664525 + 1013904223) >>> 0) / 4294967296);
  const pool = cards.filter((c) => ok.has(c.block)).map((c) => ({ c, r: rnd() })).sort((a, b) => a.r - b.r).map((x) => x.c);
  const firsts = [], rest = [], seenBlock = new Set();
  pool.forEach((c) => (seenBlock.has(c.block) ? rest : (seenBlock.add(c.block), firsts)).push(c));
  return [...firsts, ...rest].slice(0, ONBOARDING_CARDS);
}

// ---------- phase A: onboarding swipes (explicit taste) ----------
function startOnboarding() {
  const list = onboardingDeck();
  const total = list.length;
  let done = Math.min(profile.swipeCount || 0, total);
  const remaining = list.slice(done);
  if (!remaining.length) return finishOnboarding();
  setPhase(`Learning your style · ${done}/${total}`, (done / total) * 100);
  $('.round.super').classList.add('hidden');
  $('#hint').innerHTML = '<kbd>←</kbd> not for me · love it <kbd>→</kbd>';
  deck = new Deck(deckEl, {
    render: (c) => garmentCard(catalog, c, { title: c.name }),
    onSwipe: async (c, dir, { viewedMs }) => {
      const sig = dir === 'nope' ? 'nope' : 'like'; // no ordering during onboarding
      if (viewedMs >= 4000 && sig === 'nope') profile = recordSignal(u, profile, { spec: c, signal: 'dwell', itemId: c.id, kind: 'card', track: 'onboarding' });
      profile = recordSignal(u, profile, { spec: c, signal: sig, itemId: c.id, kind: 'card', track: 'onboarding' });
      done++;
      setPhase(`Learning your style · ${done}/${total}`, (done / total) * 100);
      if (done >= total) { deck.destroy(); finishOnboarding(); }
    },
  });
  deck.add(remaining);
}

async function finishOnboarding() {
  await updateUser(u, { onboardingDone: true });
  setPhase('Matching you with shoppers like you', 100);
  try { profile = await assignCohort(catalog, u, profile); } catch (e) { console.warn(e); }
  toast(profile.cohortLabel ? `Style profile ready · cohort: ${profile.cohortLabel}` : 'Style profile ready, +200 points');
  startDesigns();
}

// ---------- phase B: co-created design deck (lo-fi prototype) ----------
async function startDesigns() {
  $('.round.super').classList.remove('hidden');
  $('#hint').innerHTML = '<kbd>←</kbd> pass · <kbd>↑</kbd> order a one-off · like <kbd>→</kbd>';
  try {
    const { startDesignDeck } = await import('./js/lofi.js');
    deck = await startDesignDeck({ el: deckEl, catalog, u, user, getProfile: () => profile, setProfile: (p) => (profile = p), setPhase });
  } catch (e) {
    console.warn('design deck unavailable', e);
    setPhase('Onboarding complete', 100);
    deckEl.innerHTML = `<div class="deck-status"><h2>Your style profile is ready</h2>
      <p class="muted">The design engine isn't reachable right now.</p>
      <a class="btn primary" href="profile.html">See my profile</a></div>`;
  }
}

document.querySelectorAll('.controls [data-dir]').forEach((b) => b.addEventListener('click', () => deck?.swipe(b.dataset.dir)));
user?.onboardingDone ? startDesigns() : startOnboarding();
</script>
</body>
</html>
