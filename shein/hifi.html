<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f1ee">
<link rel="preload" as="image" href="assets/fabric.jpg">
<title>Hi-fi · SHEIN co·create</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }</script>
</head>
<body>
<main class="app">
  <header class="topbar"></header>
  <section class="panel" style="padding:14px 16px">
    <details id="gen-panel">
      <summary style="display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none">
        <span><span class="eyebrow" style="margin:0">Hi-fi prototype</span><strong id="model-name" style="font-size:14px"></strong></span>
        <span id="quota" class="pill"></span></summary>
      <div id="models" class="choice-grid" style="grid-template-columns:1fr 1fr;margin:12px 0 4px"></div>
      <label class="toggle" style="padding:10px 0 4px"><input type="checkbox" id="on-model" checked>
        <span><strong>On-model shot</strong><br><span class="muted small">Rotates body types and skin tones. Faces are always cropped out.</span></span></label>
    </details>
    <button class="btn primary block" id="gen" style="margin-top:12px"></button>
    <p id="step" class="small muted" style="margin:8px 0 0" aria-live="polite"></p>
  </section>
  <section id="deck"></section>
  <div class="controls">
    <button class="round nope" data-dir="left" aria-label="Not for me" title="Not for me (←)"></button>
    <button class="round super" data-dir="up" aria-label="Order" title="Order a one-off (↑)"></button>
    <button class="round like" data-dir="right" aria-label="Like" title="Like (→)"></button>
  </div>
  <p class="hint">Human-approved designs · best match first</p>
  <footer class="footer"></footer>
</main>
<script type="module">
import { chrome, toast, escapeHtml, icon } from './js/ui.js';
import { Deck } from './js/swipe.js';
import { DB } from './js/db.js';
import { loadCatalog, describeSpec, optionLabel, GROUPS } from './js/taste.js';
import { requireUser, getProfile, recordSwipe } from './js/store.js';
import { checkSpec, guardrailSummary } from './js/guardrails.js';
import { placeOrder, maybeEscalate } from './js/orders.js';
import { MODELS, COOLDOWN_MS, generateHifi, libraryFor, imageFor, weeklyUsage } from './js/hifi.js';

chrome('hifi.html');
const u = requireUser();
const catalog = await loadCatalog();
let profile = (await getProfile(u)) || { weights: {} };
if (!profile.swipeCount) { location.replace('swipe.html'); }
const $ = (s) => document.querySelector(s);
$('.round.nope').innerHTML = icon('x', { size: 26 });
$('.round.super').innerHTML = icon('bag', { size: 22 });
$('.round.like').innerHTML = icon('heart', { fill: true, size: 26 });
$('#gen').innerHTML = `${icon('spark')} Generate a design for me`;
const pct = (x) => `${Math.round(x * 100)}%`;

let live = {}, inventory = null;
DB.rt.on('live/attr', (v) => (live = v || {}));
DB.rt.on('inventory', (v) => (inventory = v || catalog.inventoryMeters));
const history = Object.values((await DB.rt.get(`swipes/${u}`)) || {});
const seen = new Set(history.filter((s) => s.track === 'hifi').map((s) => s.itemId));
const recent = {
  likes: history.filter((s) => s.dir !== 'nope').slice(-6).map((s) => describeSpec(catalog, s.spec)),
  nopes: history.filter((s) => s.dir === 'nope').slice(-4).map((s) => describeSpec(catalog, s.spec)),
};

// ---- model picker + quota ----
let model = localStorage.getItem('sd_model') || 'gemini-2.5-flash-image';
let usage = {};
const renderModels = () => {
  $('#models').innerHTML = Object.entries(MODELS).map(([id, m]) => `<button class="choice ${id === model ? 'selected' : ''}" data-m="${id}" ${m.enabled ? '' : 'disabled'}
    style="padding:10px 12px;${m.enabled ? '' : 'opacity:.45;cursor:not-allowed;grid-column:1/-1'}"><strong style="font-size:13px">${m.label}</strong><span class="muted small">${m.enabled ? `${id} · ${m.weeklyLimit}/week` : m.note}</span></button>`).join('');
  const m = MODELS[model];
  $('#model-name').textContent = `${m.label} · change`;
  $('#quota').textContent = m.weeklyLimit ? `${usage[model] || 0}/${m.weeklyLimit} this week` : '';
};
$('#models').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b || b.disabled) return; model = b.dataset.m; localStorage.setItem('sd_model', model); renderModels(); };
usage = await weeklyUsage(); renderModels();

// ---- deck ----
function render(d) {
  const frag = document.createDocumentFragment();
  const art = document.createElement('div');
  art.className = 'art';
  art.innerHTML = `<img alt="${escapeHtml(d.name)}" style="object-fit:cover">${d.status === 'pending' ? '<div class="badge"><span class="pill accent">Awaiting review</span></div>' : ''}`;
  imageFor(d.imageId).then((src) => (art.querySelector('img').src = src));
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<h3>${escapeHtml(d.name)}</h3>
    <p class="sub">${MODELS[d.model]?.label || d.model} · ${Math.round(d.latencyMs / 100) / 10}s · spec match ${pct(d.jev?.specMatch ?? 0)}${d.match != null ? ` · taste match ${pct(Math.max(0, d.match))}` : ''}</p>
    <div class="chips">${guardrailSummary(d.guard)}</div>`;
  frag.append(art, meta);
  return frag;
}
const withGuard = (d) => ({ ...d, key: describeKey(d), guard: checkSpec(catalog, d.spec, { inventory, ipRisk: d.jev?.ipRisk ?? 0 }) });
const describeKey = (d) => GROUPS.map((g) => d.spec[g]).join('~');
let queueIds = new Set();
const deck = new Deck($('#deck'), {
  render,
  minQueue: 2,
  emptyHtml: '<h2>You\'re all caught up</h2><p class="muted">You\'ve seen every approved design. Generate a new one above.</p>',
  need: async () => {
    const lib = (await libraryFor(catalog, u, profile.weights, seen)).filter((d) => !queueIds.has(d.id)).slice(0, 6);
    lib.forEach((d) => queueIds.add(d.id));
    return lib.map(withGuard);
  },
  onSwipe: async (d, dir) => {
    seen.add(d.id);
    if (dir === 'super' && !(await placeOrder(catalog, u, { ...d, track: 'hifi' }))) dir = 'like';
    profile = await recordSwipe(u, profile, { spec: d.spec, itemId: d.id, kind: 'design', dir, track: 'hifi', meta: { model: d.model } });
    DB.rt.incMany({ [`live/models/${d.model}/${{ like: 'likes', nope: 'nopes', super: 'orders' }[dir]}`]: 1 });
    if (dir !== 'nope') maybeEscalate(d);
  },
});
document.querySelectorAll('.controls [data-dir]').forEach((b) => b.addEventListener('click', () => deck.swipe(b.dataset.dir)));
deck.refill();

// ---- generate ----
let last = Number(localStorage.getItem('sd_lastgen_' + model) || 0);
$('#gen').onclick = async () => {
  const wait = COOLDOWN_MS - (Date.now() - Number(localStorage.getItem('sd_lastgen_' + model) || 0));
  if (wait > 0) { toast(`Rate limit: try again in ${Math.ceil(wait / 1000)}s`); return; }
  const m = MODELS[model];
  if (m.weeklyLimit && (usage[model] || 0) >= m.weeklyLimit) { toast('Weekly image quota used up for this model'); return; }
  $('#gen').disabled = true;
  localStorage.setItem('sd_lastgen_' + model, Date.now());
  try {
    const d = await generateHifi(catalog, {
      u, model, onModel: $('#on-model').checked, weights: profile.weights, recent, live, inventory,
      avoid: new Set(), onStep: (s) => ($('#step').textContent = s),
    });
    usage[model] = (usage[model] || 0) + 1; renderModels();
    $('#step').innerHTML = d.status === 'blocked'
      ? `<span class="err">Blocked by guardrails (${d.failed.join(', ')}).</span> The image is kept for audit on the dashboard.`
      : `Done in ${(d.latencyMs / 1000).toFixed(1)}s. It's in your deck now and goes to human review before other shoppers see it.`;
    if (d.status !== 'blocked') { queueIds.add(d.id); deck.queue.unshift(withGuard(d)); deck.paint(); }
  } catch (e) {
    $('#step').innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
  } finally { $('#gen').disabled = false; }
};
</script>
</body>
</html>
