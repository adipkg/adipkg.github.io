    function saveCategory() {
      const name = document.getElementById('category-name').value.trim();
      const monthlyAmount = round2(parseFloat(document.getElementById('category-amount').value));
      const isFood = document.getElementById('category-food').checked;
      if (!name || !(monthlyAmount >= 0)) return;
      const existing = editingCategoryId ? categories[editingCategoryId] : null;
      if (isFood) {
        Object.entries(categories || {}).forEach(([cid, c]) => {
          if (c.isFood && cid !== editingCategoryId) update(ref(db, 'budget/categories/' + cid), { isFood: false });
        });
      }
      const data = {
        name, monthlyAmount, isFood,
        order: existing ? (existing.order ?? categoryOrderIds.length) : categoryOrderIds.length,
        archived: existing ? !!existing.archived : false,
        createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(),
      };
      if (editingCategoryId) {
        update(ref(db, 'budget/categories/' + editingCategoryId), data);
      } else {
        const newRef = push(categoriesRef, data);
        update(ref(db, 'budget/categoryBalances/' + newRef.key), { totalAllocated: monthlyAmount, lastAllocatedMonth: currentMonthStr() });
      }
      closeModal('category-modal');
    }

    function categoryLegendHtml() {

    }
    function dayStackedTrendHtml(y, m) {
      const days = daysInMonth(y, m);
      const dayTotals = [], dayByCat = [];
      for (let day = 1; day <= days; day++) {
        const iso = `${y}-${pad2(m + 1)}-${pad2(day)}`;
        const byCat = {}; let total = 0;
        categoryOrderIds.forEach(id => {
          const amt = sumExpenses(id, iso, iso);
          if (amt > 0) { byCat[id] = amt; total += amt; }

        dayTotals.push(total); dayByCat.push(byCat);

        const segs = Object.entries(byCat).map(([id, amt]) => {
          const segPct = total > 0 ? Math.round((amt / total) * 100) : 0;
          return `<div style="height:${segPct}%;background:${categoryColor(id)}"></div>`;
        }).join('');
        return `<div class="trend-col trend-col--stack" style="height:${heightPct}%" title="${pad2(i + 1)}: ${fmtHKD(total)}">${segs}</div>`;

        <div class="note-scribble" style="margin-top:6px; ${delta > 0 ? 'color:var(--accent)' : (delta < 0 ? 'color:var(--event)' : '')}">${delta >= 0 ? '+' : ''}${delta}% vs last week</div>
      </div>
      <div class="stat">
        <div class="stat-k">${ic('clock', 12)} Last week</div>
        <div class="stat-v">${fmtHKD(lastWeekTotal)}</div>
        <div class="note-scribble" style="margin-top:6px">${lastWeek[0].slice(5)} – ${lastWeek[6].slice(5)}</div>
      </div>
      <div class="stat stat--accent">
        <div class="stat-k">${ic('tag', 12)} This month</div>
        <div class="stat-v">${fmtHKD(spentThisMonth)}</div>
        <div class="note-scribble" style="margin-top:6px">${escHtml(monthLabel)}</div>
      </div>
    </div>

    ${sect('grid', 'This week', thisWeek[0].slice(5) + ' > ' + thisWeek[6].slice(5))}
    <div class="week">${thisWeek.map(dt => reportsWeekDayColHtml(dt, dt === today, filterId)).join('')}</div>

    ${sect('grid', 'Last week', lastWeek[0].slice(5) + ' > ' + lastWeek[6].slice(5))}
    <div class="week">${lastWeek.map(dt => reportsWeekDayColHtml(dt, false, filterId)).join('')}</div>

    ${!filterId ? `
    ${sect('chart', 'Category breakdown', escHtml(monthLabel))}
    ${win(`${ic('tag', 13)} SHARE.CFG`, categoryOrderIds.length ? categoryOrderIds.map(id => catBarHtml(id, { fromIso: from, toIso: to, useMonthly: true, fundMonth: { y, m } })).join('') : emptyState('tag', 'No categories yet.'))}` : ''}

    ${sect('chart', 'Daily spend', escHtml(monthLabel))}
    ${win(`${ic('chart', 13)} TREND.LOG`, dayTrendHtml(y, m, filterId))}

    ${sect('clock', 'Last 6 months', 'MONTH-OVER-MONTH')}
    ${win(`${ic('chart', 13)} HISTORY.LOG`, last6MonthsHtml(filterId))}

    ${sect('pin', 'Browse a day', 'CLICK TO VIEW')}
    ${win(`${ic('calendar', 13)} ${escHtml(monthLabel.toUpperCase())}`, `
      <div class="cal-scroll">
        <div class="cal">
          ${weekdayHeaders.map(w => `<div class="cal-wd">${w}</div>`).join('')}
          ${cells.map(c => reportsCalDayCellHtml(c, today, reportsSelectedDate, filterId)).join('')}
        </div>
      </div>`, { bodyClass: 'win-body win-body--tight' })}

    ${win(`${ic('file', 13)} ${reportsSelectedDate ? escHtml(fmtDateLong(reportsSelectedDate)).toUpperCase() : 'SELECT A DAY'}`, reportsDayDetailHtml(filterId), { tone: 'win--accent' })}
  `;
    }

    /* ═══ SETTINGS ════════════════════════════════════════════════════════════ */
    function exportData() {
      const payload = { categories, categoryBalances, expenses, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `budget-export-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function renderSettings() {
      const el = document.getElementById('settings-content');
      const totalMonthly = categoryOrderIds.reduce((s, id) => s + (categories[id].monthlyAmount || 0), 0);
      el.innerHTML = `
    ${viewHead('System', 'SETTINGS')}
    ${win(`${ic('monitor', 13)} DISPLAY.CFG`, `
      <div class="hrow">
        <div><div class="hname">${ic(isDark() ? 'moon' : 'sun', 12)} Theme</div><div class="hrange">${isDark() ? 'Dark' : 'Light'} mode</div></div>
        <button class="btn btn--ghost" onclick="toggleTheme()">Toggle</button>
      </div>
      <div class="hrow">
        <div><div class="hname">${ic('coin', 12)} Currency</div><div class="hrange">Hong Kong Dollar (HKD)</div></div>
      </div>`)}
    ${win(`${ic('file', 13)} DATA.CFG`, `
      <div class="hrow">
        <div><div class="hname">${ic('floppy', 12)} Export data</div><div class="hrange">Download categories, balances and expenses as JSON</div></div>
        <button class="btn btn--ghost" onclick="exportData()">Export</button>
      </div>`)}

    ${sect('tag', 'Budget categories', `${fmtHKD(totalMonthly)} / MONTH`)}
    ${win(`${ic('tag', 13)} CATEGORIES.CFG`, `
      <button class="btn" style="margin-bottom:14px" onclick="openCategoryModal()">${ic('plus', 12)} Add category</button>
      ${categoryOrderIds.length ? categoryOrderIds.map(catrowHtml).join('') : emptyState('tag', 'No categories yet.')}`)}
  `;
    }

    /* ═══ CHROME RENDERERS ════════════════════════════════════════════════════ */
    function renderTitlebar() {
      document.getElementById('tb-logo').innerHTML = `${ic('coin', 16)} BUDGET<b>.EXE</b>`;
      document.getElementById('tb-btns').innerHTML = winBtns;
      const tt = document.getElementById('tb-theme');
      if (tt) tt.innerHTML = isDark() ? `${ic('sun', 12)} Light` : `${ic('moon', 12)} Dark`;
    }
    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem('budget_theme', t); } catch (e) { }
      const meta = document.getElementById('theme-color-meta');
      if (meta) meta.content = t === 'dark' ? '#131C1E' : '#33474D';
      renderTitlebar(); renderNav(); renderStatusbar(); renderTab(activeTab);
    }
    function toggleTheme() { setTheme(isDark() ? 'light' : 'dark'); }
    function renderStatusbar() {
      const today = todayISO();
      const d = new Date(today + 'T00:00:00');
      const { from, to } = monthRangeIso(d.getFullYear(), d.getMonth());
      const spentThisMonth = sumExpenses(null, from, to);
      document.getElementById('statusbar').innerHTML = `
    <span>${ic('folderOpen', 11)} ${(TABS.find(t => t.id === activeTab) || { label: activeTab }).label}</span>
    <span>${categoryOrderIds.length} categories</span>
    <span>${Object.keys(expenses || {}).length} expenses</span>
    <span>${fmtHKD(spentThisMonth)} this month</span>
    <span>DB: firebase · synced</span>
    <span class="status-grip"><i></i><i></i><i></i><i></i><i></i><i></i></span>`;
    }
    function updateClock() {
      const elx = document.getElementById('tb-clock');
      if (elx) elx.textContent = new Date().toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    /* ═══ BOOTSTRAP ═══════════════════════════════════════════════════════════ */
    document.querySelectorAll('.backdrop').forEach(mdl => {
      mdl.addEventListener('click', e => { if (e.target === mdl) mdl.hidden = true; });
    });
    document.querySelectorAll('[data-close]').forEach(elx => {
      elx.innerHTML = winBtns;
      const btns = elx.querySelectorAll('.wbtn');
      const last = btns[btns.length - 1];
      if (last) { last.style.cursor = 'pointer'; last.title = 'Close'; last.addEventListener('click', () => closeModal(elx.dataset.close)); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.backdrop').forEach(mdl => mdl.hidden = true);
    });

    renderTitlebar();
    updateClock();
    setInterval(updateClock, 30000);
    renderNav();
    renderStatusbar();
    switchTab('dashboard');

    Object.assign(window, {
      switchTab,
      quickAddExpense,
      openExpenseModal, saveExpense, deleteExpense, toggleExpenseCoffeeVisibility,
      setExpensesCategoryFilter, setExpensesDateFilter,
      openCategoryModal, saveCategory, archiveCategory,
      shiftFoodCalendarMonth, shiftReportsMonth, shiftLogMonth,
      togglePlacesVendor, clearPlacesVendors, shiftPlacesMonth, setFoodChartCoffeeOnly,
      setReportsCategoryFilter, selectReportsDay,
      toggleDashExpenses,
      exportData,
      closeModal,
      toggleTheme, setTheme,
    });
  </script>
</body>

</html>
