<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKU Hub — Adip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  [hidden]{display:none !important;}
  button{cursor:pointer;font-family:inherit;border:none;background:none;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  :root{
    --navy:#232632; --navy-2:#2b2f3d; --navy-3:#333748;
    --cream:#F3EFE4; --cream-dim:rgba(243,239,228,.62); --cream-faint:rgba(243,239,228,.38);
    --line:rgba(243,239,228,.12); --line-strong:rgba(243,239,228,.24);
    --mint:#8CE9B4; --sky:#7FC6FF; --pink:#FF9ED2; --amber:#FFD873; --lilac:#C9B6FF;
    --danger:#FF8FA3;
    --radius:16px; --radius-sm:10px;
    --shadow:0 10px 28px rgba(0,0,0,.28);
    --font-head:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
    --rail-w:78px; --topbar-h:64px;
  }

  html{scroll-behavior:smooth;}
  body{
    background:var(--navy); color:var(--cream); font-family:var(--font-body);
    font-size:15px; line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
  }

  /* ── RAIL ─────────────────────────────────────────────── */
  .rail{
    position:fixed; top:0; left:0; bottom:0; width:var(--rail-w); z-index:60;
    background:var(--navy-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:6px;
  }
  .rail-logo{
    width:36px; height:36px; border-radius:11px; margin-bottom:16px;
    background:linear-gradient(135deg,var(--mint),var(--sky));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:800; font-size:.8rem; color:#1a1d29;
  }
  .rail-item{
    width:56px; height:54px; border-radius:14px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--cream-faint); transition:background .15s,color .15s;
  }
  .rail-item i{font-size:1.25rem;}
  .rail-item span{font-size:.53rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase;}
  .rail-item:hover{background:rgba(243,239,228,.06); color:var(--cream);}
  .rail-item.active{background:rgba(140,233,180,.15); color:var(--mint);}

  /* ── TOPBAR ───────────────────────────────────────────── */
  .topbar{
    position:fixed; top:0; left:var(--rail-w); right:0; height:var(--topbar-h); z-index:50;
    display:flex; align-items:center; justify-content:space-between; padding:0 30px;
    background:rgba(35,38,50,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:700; font-size:1.02rem;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--mint),var(--sky));}
  .topbar-date{font-size:.8rem; color:var(--cream-dim);}

  /* ── MAIN / VIEWS ─────────────────────────────────────── */
  .main{margin-left:var(--rail-w); padding-top:var(--topbar-h); min-height:100vh;}
  .view{display:none; padding:30px 34px 70px; max-width:1180px;}
  .view.active{display:block;}

  .section-header{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .section-header h2{font-family:var(--font-head); font-size:1.4rem; font-weight:700;}
  .section-label{font-family:var(--font-head); font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cream-dim); margin:26px 0 12px;}
  .section-label:first-of-type{margin-top:0;}

  /* ── HERO ─────────────────────────────────────────────── */
  .hero{position:relative; overflow:hidden; padding:8px 0 26px;}
  .hero .glow{position:absolute; width:240px; height:240px; border-radius:50%; filter:blur(70px); opacity:.32; z-index:0;}
  .hero .glow-1{background:var(--mint); top:-90px; right:60px;}
  .hero .glow-2{background:var(--sky); top:20px; right:-60px;}
  .hero-inner{position:relative; z-index:1;}
  .hero h1{font-family:var(--font-head); font-size:2.1rem; font-weight:800; letter-spacing:-.01em;}
  .hero p{color:var(--cream-dim); margin-top:6px; font-size:.94rem;}

  /* ── CARDS ────────────────────────────────────────────── */
  .card{background:var(--navy-2); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px;}
  .card-head{display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-weight:700; font-size:.95rem; margin-bottom:14px;}
  .card-head i{color:var(--mint);}

  /* ── DASHBOARD ────────────────────────────────────────── */
  .dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}
  .quick-add{display:flex; gap:8px; margin-bottom:12px;}
  .quick-add input{flex:1; background:var(--navy-3); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:9px 12px; color:var(--cream); font-size:.86rem; outline:none;}
  .quick-add input:focus{border-color:var(--mint);}
  .see-all{text-align:center; font-size:.76rem; font-weight:600; color:var(--sky); cursor:pointer; padding-top:10px;}

  .week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;}
  .week-col{background:var(--navy-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; min-height:90px;}
  .week-col.is-today{border-color:var(--mint); box-shadow:0 0 0 1px var(--mint) inset;}
  .week-col-head{font-family:var(--font-head); font-weight:700; font-size:.78rem; margin-bottom:8px; display:flex; flex-direction:column; gap:1px;}
  .week-col-head span{font-weight:400; font-size:.68rem; color:var(--cream-faint);}
  .week-chip{display:inline-block; font-size:.66rem; font-weight:700; padding:3px 7px; border-radius:7px; margin:0 0 4px; letter-spacing:.02em;}
  .week-empty{color:var(--cream-faint); font-size:.7rem;}

  /* ── SESSIONS / PILLS / TAGS ──────────────────────────── */
  .pill{display:inline-flex; align-items:center; font-size:.68rem; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:20px; border:1px solid; white-space:nowrap;}
  .pill-general{background:rgba(243,239,228,.08); color:var(--cream-dim); border:1px solid var(--line-strong);}
  .kind-tag{font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:20px; color:var(--navy);}
  .kind-class{background:var(--sky);} .kind-tutorial{background:var(--lilac);} .kind-exam,.kind-final,.kind-midterm{background:var(--danger);} .kind-bootcamp{background:var(--amber);}

  .session-row{background:var(--navy-3); border-left:3px solid; border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .session-row-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .session-title{font-size:.85rem; font-weight:600;}
  .session-row-sub{display:flex; align-items:center; gap:14px; font-size:.72rem; color:var(--cream-dim); flex-wrap:wrap;}
  .session-row-sub i{margin-right:3px;}
  .session-note{color:var(--amber);}

  .empty-state{text-align:center; padding:34px 10px; color:var(--cream-faint); font-size:.85rem;}
  .empty-state i{display:block; font-size:1.8rem; margin-bottom:8px; color:var(--cream-faint);}

  /* ── CHIPS / FILTERS ──────────────────────────────────── */
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{font-size:.72rem; font-weight:600; padding:6px 13px; border-radius:20px; border:1px solid var(--line-strong); color:var(--cream-dim); cursor:pointer; background:rgba(243,239,228,.04); transition:all .15s;}
  .chip.active{color:#1a1d29; background:var(--cream); border-color:var(--cream);}
  .search-input{width:100%; background:var(--navy-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px 14px; color:var(--cream); font-size:.86rem; outline:none; margin-bottom:14px;}
  .search-input:focus{border-color:var(--sky);}

  /* ── TIMETABLE (monthly calendar) ────────────────────── */
  .cal-nav{display:flex; align-items:center; gap:10px;}
  .cal-month-label{font-family:var(--font-head); font-weight:700; font-size:.95rem; min-width:150px; text-align:center;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px;}
  .cal-weekday{text-align:center; font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cream-faint); padding-bottom:2px;}
  .cal-day{background:var(--navy-2); border:1px solid var(--line); border-radius:10px; min-height:88px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:border-color .15s,background .15s;}
  .cal-day:hover{border-color:var(--line-strong);}
  .cal-day.outside{opacity:.32;}
  .cal-day.is-today{border-color:var(--mint);}
  .cal-day.is-today .cal-day-num{color:var(--mint); font-weight:800;}
  .cal-day.is-selected{background:var(--navy-3); border-color:var(--sky); box-shadow:0 0 0 1px var(--sky) inset;}
  .cal-day-num{font-size:.76rem; font-weight:600; color:var(--cream-dim);}
  .cal-day-sessions{display:flex; flex-direction:column; gap:2px; overflow:hidden;}
  .cal-chip{font-size:.6rem; font-weight:700; padding:2px 5px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal-more{font-size:.6rem; color:var(--cream-faint); padding-left:2px;}
  .preset-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .preset-label{display:flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cream-faint); margin-right:2px;}
  .preset-chip{background:rgba(201,182,255,.12); border-color:rgba(201,182,255,.35); color:var(--lilac); display:inline-flex; align-items:center; gap:6px;}
  .preset-x{font-size:.85rem; opacity:.7;}
  .preset-x:hover{opacity:1; color:var(--danger);}
  .preset-save{color:var(--cream-dim); border-style:dashed;}
  .preset-save:hover{color:var(--mint); border-color:var(--mint);}

  /* ── TODOS ────────────────────────────────────────────── */
  .todo-list.compact .todo-row{padding:8px 10px;}
  .todo-row{display:flex; align-items:flex-start; gap:10px; background:var(--navy-3); border-radius:10px; padding:11px 13px; margin-bottom:8px;}
  .todo-row input[type=checkbox]{width:17px; height:17px; margin-top:2px; accent-color:var(--mint); flex-shrink:0;}
  .todo-row-body{flex:1; min-width:0;}
  .todo-text{font-size:.86rem; font-weight:500;}
  .todo-row.is-done .todo-text{text-decoration:line-through; color:var(--cream-faint);}
  .todo-meta{display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;}
  .todo-due{font-size:.7rem; color:var(--cream-dim);}
  .todo-due.overdue{color:var(--danger); font-weight:700;}
  .priority-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .priority-dot.p-high{background:var(--danger);} .priority-dot.p-medium{background:var(--amber);} .priority-dot.p-low{background:var(--line-strong);}
  .row-actions{display:flex; gap:4px; flex-shrink:0;}

  /* ── NOTES ────────────────────────────────────────────── */
  .notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .note-card{background:var(--navy-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 17px; display:flex; flex-direction:column; gap:8px;}
  .note-card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .note-date{font-size:.68rem; color:var(--cream-faint);}
  .note-title{font-family:var(--font-head); font-weight:700; font-size:.92rem;}
  .note-preview{font-size:.78rem; color:var(--cream-dim); line-height:1.55; flex:1;}

  /* ── HOLIDAYS ─────────────────────────────────────────── */
  .holiday-add{margin-bottom:14px;}
  .holiday-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);}
  .holiday-row:last-child{border-bottom:none;}
  .holiday-name{font-weight:600; font-size:.86rem;}
  .holiday-range{font-size:.74rem; color:var(--cream-dim); margin-top:2px;}
  .freeday-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .freeday-chip{font-size:.74rem; font-weight:600; padding:6px 12px; border-radius:20px; background:rgba(140,233,180,.12); color:var(--mint); border:1px solid rgba(140,233,180,.3);}

  /* ── COURSES ──────────────────────────────────────────── */
  .course-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:6px;}
  .course-card{background:var(--navy-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
  .course-card-top{display:flex; align-items:center; justify-content:space-between;}
  .type-tag{font-size:.64rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cream-faint);}
  .course-title{font-family:var(--font-head); font-weight:700; font-size:.94rem; line-height:1.3;}
  .course-sub{font-size:.74rem; color:var(--cream-dim);}
  .course-blurb{font-size:.78rem; color:var(--cream-dim); line-height:1.55; flex:1;}
  .course-card-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}

  .grading-card{overflow-x:auto;}
  .grading-table{width:100%; border-collapse:collapse; font-size:.82rem;}
  .grading-table th{text-align:left; padding:7px 10px; color:var(--cream-faint); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line);}
  .grading-table td{padding:7px 10px; border-bottom:1px solid var(--line);}
  .grading-table tr:last-child td{border-bottom:none;}

  /* ── BUTTONS ──────────────────────────────────────────── */
  .btn-primary{display:inline-flex; align-items:center; gap:6px; background:var(--mint); color:#12261b; font-weight:700; font-size:.8rem; padding:9px 16px; border-radius:10px; transition:opacity .15s;}
  .btn-primary:hover{opacity:.86;}
  .btn-ghost{display:inline-flex; align-items:center; gap:6px; background:rgba(243,239,228,.06); border:1px solid var(--line-strong); color:var(--cream); font-weight:600; font-size:.76rem; padding:7px 13px; border-radius:9px; transition:background .15s;}
  .btn-ghost:hover{background:rgba(243,239,228,.12);}
  .btn-icon{width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; color:var(--cream-dim); transition:background .15s,color .15s;}
  .btn-icon:hover{background:rgba(243,239,228,.1); color:var(--cream);}
  .btn-icon.danger:hover{background:rgba(255,143,163,.15); color:var(--danger);}

  /* ── MODALS ───────────────────────────────────────────── */
  .modal-backdrop{position:fixed; inset:0; background:rgba(15,17,23,.6); backdrop-filter:blur(3px); z-index:600; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-box{width:100%; max-width:420px; background:var(--navy-2); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); font-family:var(--font-head); font-weight:700; font-size:1rem;}
  .modal-body{padding:18px;}
  .modal-foot{display:flex; gap:8px; padding:0 18px 18px;}
  .f-label{display:block; font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cream-faint); margin-bottom:6px;}
  .f-input{width:100%; background:var(--navy-3); border:1px solid var(--line-strong); border-radius:9px; padding:9px 11px; color:var(--cream); font-size:.86rem; outline:none; margin-bottom:14px;}
  .f-input:focus{border-color:var(--sky);}
  textarea.f-input{resize:vertical; min-height:90px;}
  .f-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ── RESPONSIVE ───────────────────────────────────────── */
  @media (max-width:860px){
    .dash-grid{grid-template-columns:1fr;}
  }
  @media (max-width:720px){
    :root{--rail-w:0px;}
    .rail{top:auto; bottom:0; left:0; right:0; width:100%; height:62px; flex-direction:row; justify-content:space-evenly; border-right:none; border-top:1px solid var(--line); padding:0;}
    .rail-logo{display:none;}
    .rail-item{width:auto; flex:1; height:100%;}
    .topbar{left:0;}
    .main{margin-left:0; padding-bottom:80px;}
    .view{padding:24px 16px 40px;}
    .week-strip{grid-template-columns:repeat(7,minmax(90px,1fr)); overflow-x:auto;}
    .f-row{grid-template-columns:1fr;}
    .topbar-date{font-size:.7rem;}
    .cal-day{min-height:58px; padding:4px;}
    .cal-day-num{font-size:.68rem;}
    .cal-chip{font-size:.52rem; padding:1px 3px;}
    .cal-month-label{min-width:auto; font-size:.85rem;}
  }
</style>
</head>
<body>

<div class="rail" id="rail">
  <div class="rail-logo">HK</div>
  <div class="rail-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="ri-home-5-line"></i><span>Home</span></div>
  <div class="rail-item" data-tab="timetable" onclick="switchTab('timetable')"><i class="ri-calendar-2-line"></i><span>Timetable</span></div>
  <div class="rail-item" data-tab="holidays" onclick="switchTab('holidays')"><i class="ri-sun-line"></i><span>Breaks</span></div>
  <div class="rail-item" data-tab="todos" onclick="switchTab('todos')"><i class="ri-checkbox-line"></i><span>Todos</span></div>
  <div class="rail-item" data-tab="notes" onclick="switchTab('notes')"><i class="ri-sticky-note-line"></i><span>Notes</span></div>
  <div class="rail-item" data-tab="courses" onclick="switchTab('courses')"><i class="ri-book-2-line"></i><span>Courses</span></div>
</div>

<div class="topbar">
  <div class="brand"><span class="brand-dot"></span> HKU Hub</div>
  <div class="topbar-date" id="topbar-date"></div>
</div>

<main class="main">
  <div class="view active" id="view-dashboard"><div id="dashboard-content"></div></div>
  <div class="view" id="view-timetable"><div id="timetable-content"></div></div>
  <div class="view" id="view-holidays"><div id="holidays-content"></div></div>
  <div class="view" id="view-todos"><div id="todos-content"></div></div>
  <div class="view" id="view-notes"><div id="notes-content"></div></div>
  <div class="view" id="view-courses"><div id="courses-content"></div></div>
</main>

<!-- ── TODO MODAL ─────────────────────────────────────────── -->
<div id="todo-modal" class="modal-backdrop" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="todo-modal-title">New Todo</span><button class="btn-icon" onclick="closeModal('todo-modal')"><i class="ri-close-line"></i></button></div>
    <div class="modal-body">
      <label class="f-label">Task</label>
      <input type="text" id="todo-text" class="f-input" placeholder="What needs doing?">
      <div class="f-row">
        <div><label class="f-label">Due date</label><input type="date" id="todo-due" class="f-input"></div>
        <div><label class="f-label">Priority</label>
          <select id="todo-priority" class="f-input">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <label class="f-label">Course (optional)</label>
      <select id="todo-course" class="f-input"></select>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="saveTodo()">Save</button>
      <button class="btn-ghost" onclick="closeModal('todo-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- ── NOTE MODAL ─────────────────────────────────────────── -->
<div id="note-modal" class="modal-backdrop" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="note-modal-title">New Note</span><button class="btn-icon" onclick="closeModal('note-modal')"><i class="ri-close-line"></i></button></div>
    <div class="modal-body">
      <label class="f-label">Title</label>
      <input type="text" id="note-title" class="f-input" placeholder="Note title">
      <label class="f-label">Course (blank = general note)</label>
      <select id="note-course" class="f-input"></select>
      <label class="f-label">Note</label>
      <textarea id="note-body" class="f-input" placeholder="Write your note…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" onclick="saveNote()">Save</button>
      <button class="btn-ghost" onclick="closeModal('note-modal')">Cancel</button>
    </div>
  </div>
</div>

// ─── Utilities ───────────────────────────────────────────────────────────────
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayISO(){ return fmtISO(new Date()); }
function escHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return new Date(2000,0,1,h,m).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function fmtTimeRange(start,end){
  if (start==='00:00' && end==='23:59') return 'All day';
  return `${fmtTime(start)} – ${fmtTime(end)}`;
}
function fmtDateShort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDateLong(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function sessionsOnDate(iso){ return SESSIONS.filter(s=>s.date===iso).sort((a,b)=>a.start.localeCompare(b.start)); }
function weekRange(todayIso){
  const d = new Date(todayIso+'T00:00:00');
  const dow = (d.getDay()+6)%7; // 0=Mon
  const monday = new Date(d); monday.setDate(d.getDate()-dow);
  return Array.from({length:7}, (_,i)=>{ const dd=new Date(monday); dd.setDate(monday.getDate()+i); return fmtISO(dd); });
}
function computeFreeDays(fromIso, days, courseSet){
  const out = []; let d = new Date(fromIso+'T00:00:00');
  for(let i=0;i<days;i++){
    const iso = fmtISO(d);
    const sessions = courseSet
      ? sessionsOnDate(iso).filter(s => courseSet.has(s.code))
      : sessionsOnDate(iso);
    if (iso>=PROGRAM_START && iso<=PROGRAM_END && sessions.length===0) out.push(iso);
    d.setDate(d.getDate()+1);
  }
  return out;
}

      </div>

    <div class="week-strip">${weekDates.map(d=>weekDayColHtml(d, d===today)).join('')}</div>

// ─── Timetable (monthly calendar) ───────────────────────────────────────────
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function cellIso(c){ return `${c.y}-${pad2(c.m+1)}-${pad2(c.day)}`; }
function buildCalendarCells(y,m){
  const firstDow = (new Date(y,m,1).getDay()+6)%7; // Monday=0
  const numDays = daysInMonth(y,m);
  const prevM = m-1<0 ? 11 : m-1, prevY = m-1<0 ? y-1 : y;
  const prevMonthDays = daysInMonth(prevY,prevM);
  const nextM = m+1>11 ? 0 : m+1, nextY = m+1>11 ? y+1 : y;
  const cells = [];
  for (let i=0;i<firstDow;i++) cells.push({ y:prevY, m:prevM, day:prevMonthDays-firstDow+1+i, outside:true });
  for (let d=1; d<=numDays; d++) cells.push({ y, m, day:d, outside:false });
  let nd = 1;
  while (cells.length % 7 !== 0) cells.push({ y:nextY, m:nextM, day:nd++, outside:true });
  return cells;
}
function calDayCellHtml(c, todayIso, selIso){
  const iso = cellIso(c);
  const sess = sessionsOnDate(iso).filter(s=>courseFilter.has(s.code));
  const maxShow = 3;
  const shown = sess.slice(0,maxShow);
  const extra = sess.length - shown.length;
  return `<div class="cal-day ${c.outside?'outside':''} ${iso===todayIso?'is-today':''} ${iso===selIso?'is-selected':''}" onclick="selectCalendarDay('${iso}')">
    <div class="cal-day-num">${c.day}</div>
    <div class="cal-day-sessions">
      ${shown.map(s=>`<div class="cal-chip" style="background:${courseColor(s.code)}22;color:${courseColor(s.code)}">${escHtml(s.code)}</div>`).join('')}
      ${extra>0 ? `<div class="cal-more">+${extra} more</div>` : ''}
    </div>
  </div>`;
}
function renderTimetable(){
  const el = document.getElementById('timetable-content');
  const today = todayISO();
  const { y, m } = calendarMonth;
  const cells = buildCalendarCells(y,m);
  const monthLabel = new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const allSelected = courseFilter.size===COURSE_ORDER.length;
  const weekdayHeaders = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const selSessions = selectedDate ? sessionsOnDate(selectedDate).filter(s=>courseFilter.has(s.code)) : [];

  el.innerHTML = `
    <div class="section-header">
      <h2>Timetable</h2>
      <div class="cal-nav">
        <button class="btn-icon" onclick="shiftCalendarMonth(-1)"><i class="ri-arrow-left-s-line"></i></button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="btn-icon" onclick="shiftCalendarMonth(1)"><i class="ri-arrow-right-s-line"></i></button>
        <button class="btn-ghost" onclick="goToTodayMonth()">Today</button>
      </div>
    </div>
    <div class="chip-row">
      <span class="chip ${allSelected?'active':''}" onclick="setAllCourseFilters()">All</span>
      ${COURSE_ORDER.map(code=>{
        const c = courseColor(code); const on = courseFilter.has(code);
        return `<span class="chip ${on?'active':''}" style="${on?`background:${c};border-color:${c};color:#1a1d29`:`border-color:${c}55;color:${c}`}" onclick="toggleCourseFilter('${code}')">${code}</span>`;
      }).join('')}
    </div>
    <div class="preset-row">
      <span class="preset-label"><i class="ri-bookmark-line"></i> Presets</span>
      ${Object.entries(presets||{}).map(([id,p])=>`
        <span class="chip preset-chip" onclick="loadPreset('${id}')">${escHtml(p.name)}<i class="ri-close-line preset-x" onclick="event.stopPropagation();deletePreset('${id}')"></i></span>
      `).join('')}
      <span class="chip preset-save" onclick="savePreset()"><i class="ri-add-line"></i> Save current</span>
    </div>
    <div class="cal-grid">
      ${weekdayHeaders.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
      ${cells.map(c=>calDayCellHtml(c, today, selectedDate)).join('')}
    </div>
    <div class="card">
      <div class="card-head"><i class="ri-calendar-event-line"></i> ${selectedDate ? fmtDateLong(selectedDate) : 'Select a day'}</div>
      ${selectedDate ? (selSessions.length ? selSessions.map(sessionCardHtml).join('') : emptyState('ri-cup-line','No classes on this day.')) : emptyState('ri-cursor-line','Click a date on the calendar to see details.')}
    </div>
  `;
}
function toggleCourseFilter(code){
  if (courseFilter.has(code)) courseFilter.delete(code); else courseFilter.add(code);
  if (courseFilter.size===0) courseFilter = new Set(COURSE_ORDER);
  renderTimetable();
}
function setAllCourseFilters(){ courseFilter = new Set(COURSE_ORDER); renderTimetable(); }
function shiftCalendarMonth(delta){
  let { y, m } = calendarMonth;
  m += delta;
  if (m<0) { m=11; y--; } else if (m>11) { m=0; y++; }
  calendarMonth = { y, m };
  renderTimetable();
}
function goToTodayMonth(){
  const d = new Date();
  calendarMonth = { y: d.getFullYear(), m: d.getMonth() };
  selectedDate = todayISO();
  renderTimetable();
}
function selectCalendarDay(iso){
  const d = new Date(iso+'T00:00:00');
  calendarMonth = { y: d.getFullYear(), m: d.getMonth() };
  selectedDate = iso;
  renderTimetable();
}
function goToCourseTimetable(code){
  courseFilter = new Set([code]);
  const today = todayISO();
  const sess = SESSIONS.filter(s=>s.code===code).sort((a,b)=>a.date.localeCompare(b.date));
  const target = sess.find(s=>s.date>=today) || sess[sess.length-1];
  if (target) {
    const d = new Date(target.date+'T00:00:00');
    calendarMonth = { y: d.getFullYear(), m: d.getMonth() };
    selectedDate = target.date;
  }
  switchTab('timetable');
}
function savePreset(){
  const name = prompt('Name this preset:');
  if (!name || !name.trim()) return;
  push(presetsRef, { name: name.trim(), courses: [...courseFilter] });
}
function loadPreset(id){
  const p = presets[id];
  if (!p) return;
  courseFilter = new Set(p.courses||[]);
  renderTimetable();
}
function deletePreset(id){
  const p = presets[id];
  if (confirm(`Delete preset "${p ? p.name : ''}"?`)) remove(ref(db,'presets/'+id));
}

// ─── Holidays & days off ────────────────────────────────────────────────────
function holidayRowHtml(id,h){
  const range = h.start===h.end ? fmtDateLong(h.start) : `${fmtDateLong(h.start)} – ${fmtDateLong(h.end)}`;
  return `<div class="holiday-row">
    <div><div class="holiday-name">${escHtml(h.name)}</div><div class="holiday-range">${range}</div></div>
    <div class="row-actions">
      <button class="btn-icon" onclick="openHolidayModal('${id}')"><i class="ri-pencil-line"></i></button>
      <button class="btn-icon danger" onclick="deleteHoliday('${id}')"><i class="ri-delete-bin-line"></i></button>
    </div>
  </div>`;
}
function renderHolidays(){
  const el = document.getElementById('holidays-content');
  const list = Object.entries(holidays||{}).sort((a,b)=>a[1].start.localeCompare(b[1].start));
  const _today = new Date(); const _end = new Date(PROGRAM_END+'T00:00:00');
  const _daysLeft = Math.max(0, Math.ceil((_end - _today) / 86400000) + 1);
  const freeDays = computeFreeDays(todayISO(), _daysLeft, courseFilter);

  // Build sorted unique months from all free days
  const months = [...new Set(freeDays.map(d => d.slice(0,7)))].sort();

  // Validate stored filter still exists
  if (freeDaysMonthFilter && !months.includes(freeDaysMonthFilter)) freeDaysMonthFilter = null;

  const filtered = freeDaysMonthFilter ? freeDays.filter(d => d.startsWith(freeDaysMonthFilter)) : freeDays;

  const monthLabel = iso => new Date(iso+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const monthChips = [
    `<span class="chip ${!freeDaysMonthFilter?'active':''}" onclick="setFreeDaysMonth(null)">All</span>`,
    ...months.map(m => `<span class="chip ${freeDaysMonthFilter===m?'active':''}" onclick="setFreeDaysMonth('${m}')">${monthLabel(m)}</span>`)
  ].join('');

  el.innerHTML = `
    <div class="section-header"><h2>Holidays &amp; Days Off</h2><button class="btn-primary" onclick="openHolidayModal()"><i class="ri-add-line"></i> Add break</button></div>
    <div class="card">
      <div class="card-head"><i class="ri-sun-line"></i> Named breaks</div>
      ${list.length ? list.map(([id,h])=>holidayRowHtml(id,h)).join('') : emptyState('ri-sun-line','No breaks added yet.')}
    </div>
    <div class="card">
      <div class="card-head"><i class="ri-calendar-close-line"></i> All upcoming days without class</div>
      <div class="chip-row" style="margin-bottom:14px">${monthChips}</div>
      <div id="freeday-grid-inner">
        ${filtered.length ? `<div class="freeday-grid">${filtered.map(d=>`<div class="freeday-chip">${escHtml(new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}))}</div>`).join('')}</div>` : emptyState('ri-calendar-check-line','No free days in this month.')}
      </div>
    </div>
  `;
}
function setFreeDaysMonth(m){ freeDaysMonthFilter = m; renderHolidays(); }
function openHolidayModal(id){
  editingHolidayId = id || null;
  const h = id ? holidays[id] : null;
  document.getElementById('holiday-modal-title').textContent = id ? 'Edit Break' : 'Add Break';
  document.getElementById('holiday-name').value = h ? h.name : '';
  document.getElementById('holiday-start').value = h ? h.start : '';
  document.getElementById('holiday-end').value = h ? h.end : '';
  document.getElementById('holiday-modal').hidden = false;
}
function saveHoliday(){
  const name = document.getElementById('holiday-name').value.trim();
  const start = document.getElementById('holiday-start').value;
  const end = document.getElementById('holiday-end').value || start;
  if (!name || !start) return;
  const data = { name, start, end };
  if (editingHolidayId) update(ref(db,'holidays/'+editingHolidayId), data);
  else push(holidaysRef, data);
  closeModal('holiday-modal');
}
function deleteHoliday(id){ if (confirm('Delete this break?')) remove(ref(db,'holidays/'+id)); }

// ─── Todos ───────────────────────────────────────────────────────────────────
function todoRowHtml(id,t,today,compact){
  const overdue = t.due && t.due<today && !t.done;
  const c = t.course ? courseColor(t.course) : null;
  return `<div class="todo-row ${t.done?'is-done':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodoDone('${id}')">
    <div class="todo-row-body">
      <div class="todo-text">${escHtml(t.text)}</div>
      <div class="todo-meta">
        ${t.due?`<span class="todo-due ${overdue?'overdue':''}"><i class="ri-calendar-line"></i> ${fmtDateShort(t.due)}</span>`:''}
        <span class="priority-dot p-${t.priority||'low'}"></span>
        ${t.course?`<span class="pill" style="background:${c}22;color:${c};border-color:${c}55">${escHtml(t.course)}</span>`:''}
      </div>
    </div>
    ${compact ? '' : `<div class="row-actions">
      <button class="btn-icon" onclick="openTodoModal('${id}')"><i class="ri-pencil-line"></i></button>
      <button class="btn-icon danger" onclick="deleteTodo('${id}')"><i class="ri-delete-bin-line"></i></button>
    </div>`}
  </div>`;
}
function renderTodos(){
  const el = document.getElementById('todos-content');
  const today = todayISO();
  let list = Object.entries(todos||{});
  if (todosFilter==='today') list = list.filter(([,t])=>t.due===today && !t.done);
  else if (todosFilter==='overdue') list = list.filter(([,t])=>t.due && t.due<today && !t.done);
  else if (todosFilter==='done') list = list.filter(([,t])=>t.done);
  else list = list.filter(([,t])=>!t.done);
  list.sort((a,b)=>{
    if ((a[1].due||'9999')!==(b[1].due||'9999')) return (a[1].due||'9999').localeCompare(b[1].due||'9999');
    return (b[1].createdAt||0)-(a[1].createdAt||0);
  });

  el.innerHTML = `
    <div class="section-header"><h2>Todos</h2><button class="btn-primary" onclick="openTodoModal()"><i class="ri-add-line"></i> Add todo</button></div>
    <div class="chip-row">
      ${['active','today','overdue','done'].map(f=>`<span class="chip ${todosFilter===f?'active':''}" onclick="setTodoFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}</span>`).join('')}
    </div>
    <div class="todo-list">${list.length ? list.map(([id,t])=>todoRowHtml(id,t,today,false)).join('') : emptyState('ri-checkbox-circle-line','Nothing here.')}</div>
  `;
}
function setTodoFilter(f){ todosFilter = f; renderTodos(); }
function quickAddTodo(){
  const input = document.getElementById('quick-todo-input');
  const text = input.value.trim();
  if (!text) return;
  push(todosRef, { text, due:null, priority:'medium', course:null, done:false, createdAt:Date.now() });
  input.value = '';
}
function openTodoModal(id){
  editingTodoId = id || null;
  const t = id ? todos[id] : null;
  document.getElementById('todo-modal-title').textContent = id ? 'Edit Todo' : 'New Todo';
  document.getElementById('todo-text').value = t ? t.text : '';
  document.getElementById('todo-due').value = t ? (t.due||'') : '';
  document.getElementById('todo-priority').value = t ? (t.priority||'medium') : 'medium';
  document.getElementById('todo-course').value = t ? (t.course||'') : '';
  document.getElementById('todo-modal').hidden = false;
}
function saveTodo(){
  const text = document.getElementById('todo-text').value.trim();
  if (!text) return;
  const existing = editingTodoId ? todos[editingTodoId] : null;
  const data = {
    text,
    due: document.getElementById('todo-due').value || null,
    priority: document.getElementById('todo-priority').value,
    course: document.getElementById('todo-course').value || null,
    done: existing ? !!existing.done : false,
    createdAt: existing ? (existing.createdAt||Date.now()) : Date.now(),
  };
  if (editingTodoId) update(ref(db,'todos/'+editingTodoId), data);
  else push(todosRef, data);
  closeModal('todo-modal');
}
function toggleTodoDone(id){ update(ref(db,'todos/'+id), { done: !todos[id].done }); }
function deleteTodo(id){ if (confirm('Delete this todo?')) remove(ref(db,'todos/'+id)); }

// ─── Notes ───────────────────────────────────────────────────────────────────
function noteCardHtml(id,n){
  const c = n.course ? courseColor(n.course) : null;
  const body = n.body || '';
  const preview = body.slice(0,140) + (body.length>140 ? '…' : '');
  return `<div class="note-card">
    <div class="note-card-top">
      ${n.course ? `<span class="pill" style="background:${c}22;color:${c};border-color:${c}55">${escHtml(n.course)}</span>` : `<span class="pill pill-general">General</span>`}
      <span class="note-date">${n.updatedAt ? fmtDateShort(fmtISO(new Date(n.updatedAt))) : ''}</span>
    </div>
    <div class="note-title">${escHtml(n.title||'Untitled note')}</div>
    <div class="note-preview">${escHtml(preview)}</div>
    <div class="row-actions">
      <button class="btn-icon" onclick="openNoteModal('${id}')"><i class="ri-pencil-line"></i></button>
      <button class="btn-icon danger" onclick="deleteNote('${id}')"><i class="ri-delete-bin-line"></i></button>
    </div>
  </div>`;
}
function notesGridHtml(){
  let list = Object.entries(notes||{});
  if (notesCourseFilter) list = list.filter(([,n]) => notesCourseFilter==='__general__' ? !n.course : n.course===notesCourseFilter);
  if (notesSearch) { const s=notesSearch.toLowerCase(); list = list.filter(([,n])=>(n.title||'').toLowerCase().includes(s)||(n.body||'').toLowerCase().includes(s)); }
  list.sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  return list.length ? list.map(([id,n])=>noteCardHtml(id,n)).join('') : emptyState('ri-sticky-note-line','No notes yet.');
}
function renderNotes(){
  const el = document.getElementById('notes-content');
  el.innerHTML = `
    <div class="section-header"><h2>Notes</h2><button class="btn-primary" onclick="openNoteModal()"><i class="ri-add-line"></i> Add note</button></div>
    <input type="text" class="search-input" placeholder="Search notes…" value="${escHtml(notesSearch)}" oninput="handleNotesSearch(this.value)">
    <div class="chip-row">
      <span class="chip ${!notesCourseFilter?'active':''}" onclick="setNotesCourseFilter(null)">All</span>
      <span class="chip ${notesCourseFilter==='__general__'?'active':''}" onclick="setNotesCourseFilter('__general__')">General</span>
      ${COURSE_ORDER.map(code=>{
        const c=courseColor(code); const on=notesCourseFilter===code;
        return `<span class="chip ${on?'active':''}" style="${on?`background:${c};border-color:${c};color:#1a1d29`:`border-color:${c}55;color:${c}`}" onclick="setNotesCourseFilter('${code}')">${code}</span>`;
      }).join('')}
    </div>
    <div class="notes-grid" id="notes-grid-inner">${notesGridHtml()}</div>
  `;
}
function handleNotesSearch(v){ notesSearch = v; const g = document.getElementById('notes-grid-inner'); if (g) g.innerHTML = notesGridHtml(); }
function setNotesCourseFilter(code){ notesCourseFilter = code; renderNotes(); }
function goToCourseNotes(code){ notesCourseFilter = code; switchTab('notes'); }
function openNoteModal(id){
  editingNoteId = id || null;
  const n = id ? notes[id] : null;
  document.getElementById('note-modal-title').textContent = id ? 'Edit Note' : 'New Note';
  document.getElementById('note-title').value = n ? (n.title||'') : '';
  document.getElementById('note-course').value = n ? (n.course||'') : '';
  document.getElementById('note-body').value = n ? (n.body||'') : '';
  document.getElementById('note-modal').hidden = false;
}
function saveNote(){
  const title = document.getElementById('note-title').value.trim() || 'Untitled note';
  const body = document.getElementById('note-body').value.trim();
  const course = document.getElementById('note-course').value || null;
  if (!body) return;
  const now = Date.now();
  const existing = editingNoteId ? notes[editingNoteId] : null;
  const data = { title, body, course, updatedAt: now, createdAt: existing ? (existing.createdAt||now) : now };
  if (editingNoteId) update(ref(db,'notes/'+editingNoteId), data);
  else push(notesRef, data);
  closeModal('note-modal');
}
function deleteNote(id){ if (confirm('Delete this note?')) remove(ref(db,'notes/'+id)); }
